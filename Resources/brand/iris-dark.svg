<?xml version="1.0" encoding="UTF-8"?>
<!-- The Iris — canonical dark variant. Vector master for Resources/AURA.icns
     (rendered only by scripts/generate-app-icon.sh; PNGs are never committed).
     Full-bleed per the macOS 26+ adaptive icon contract: the platform now
     supplies its own squircle mask, edge bevel and specular pass, so the
     master fills the entire 0,0-1024,1024 canvas with no self-drawn margin,
     rounding or bevel of its own (a prior version drew its own inset
     rounded-rect "plate" at 100,100/824x824 — under the platform's own
     plate that produced a visible double border). Geometry per
     ui-improvement-plan/10-icon-identity.md §2: dark glass field, thin
     luminous iris ring (#5AE6C8 → #1FB59A), core dot upper-right (the only
     asymmetric element), and a faint radial aura field between ring and
     core. Ring/core coordinates are unchanged from the prior version — both
     were already centered on the canvas's true center (512,512), so only
     the background fill extends to full-bleed.
     16 px legibility gate: below 32 px the mark survives as ring + core only —
     the sheen and aura are opacity-graded to vanish in the reduction. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B222C"/>
      <stop offset="0.55" stop-color="#10151C"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="irisRing" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5AE6C8"/>
      <stop offset="1" stop-color="#1FB59A"/>
    </linearGradient>
    <radialGradient id="auraField" cx="0.586" cy="0.414" r="0.46">
      <stop offset="0" stop-color="#5AE6C8" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#5AE6C8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5AE6C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="baseVignette" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed glass field; the platform applies its own squircle mask. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glassBody)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#baseVignette)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#auraField)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glassSheen)"/>

  <!-- Iris ring. -->
  <circle cx="512" cy="512" r="240" fill="none" stroke="url(#irisRing)" stroke-width="52"/>
  <!-- Core dot, upper-right, with its aura glow. -->
  <circle cx="600" cy="424" r="104" fill="#5AE6C8" opacity="0.14"/>
  <circle cx="600" cy="424" r="66" fill="#5AE6C8"/>
</svg>