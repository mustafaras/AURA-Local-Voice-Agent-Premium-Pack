<?xml version="1.0" encoding="UTF-8"?>
<!-- The Iris — light "Daylight Lab" variant: paper disc, deep-teal ring.
     Same geometry as iris-dark.svg (10-icon-identity.md §2); the palette
     inverts per 09-visual-language.md §3.1. Rendered only by
     scripts/generate-app-icon.sh; PNGs are never committed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="paperBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/>
      <stop offset="1" stop-color="#EDE9E0"/>
    </linearGradient>
    <linearGradient id="deepTealRing" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0E8467"/>
      <stop offset="1" stop-color="#0A6B54"/>
    </linearGradient>
    <radialGradient id="paperShade" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#3E3A32" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#3E3A32" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#3E3A32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paperBody)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paperShade)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5"
        fill="none" stroke="#1A1A1A" stroke-opacity="0.10" stroke-width="3"/>

  <circle cx="512" cy="512" r="240" fill="none" stroke="url(#deepTealRing)" stroke-width="52"/>
  <circle cx="600" cy="424" r="100" fill="#0E8467" opacity="0.10"/>
  <circle cx="600" cy="424" r="66" fill="#0E8467"/>
</svg>