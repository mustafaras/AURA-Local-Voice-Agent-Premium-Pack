name: AURA CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: [self-hosted, macOS, swift-6.4]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Validate runtime-completion governance
        run: python3 scripts/validate_runtime_completion.py --ci

      - name: Run governance validator tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run Chatterbox Python runtime tests
        run: PYTHONPATH=Runtime/chatterbox python3 -m unittest discover -s Runtime/chatterbox/tests -p 'test_*.py'

      - name: Validate repository hygiene control plane
        run: python3 scripts/validate_repo_hygiene_program.py

      - name: Validate second-pass control plane
        run: python3 scripts/validate_second_pass_program.py

      - name: Validate secret, dependency, and supply-chain hygiene
        run: python3 scripts/validate_repo_hygiene_supply_chain.py

      - name: Check shell scripts and diff hygiene
        run: |
          zsh -n scripts/*.sh
          git diff --check

  build-and-test:
    needs: governance
    runs-on: [self-hosted, macOS, swift-6.4]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Swift version
        run: |
          xcode-select -p
          swift --version

      - name: Build production targets
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Run tests
        env:
          AURA_ENABLE_COVERAGE: "1"
          AURA_COVERAGE_MIN: "70"
        run: ./scripts/aura-test.sh /tmp/aurabuild-ci

      - name: Build development-unverified release evidence
        env:
          BUILD_ROOT: ${{ runner.temp }}/aura-r11-release-artifact
          OUTPUT_DIR: ${{ runner.temp }}/aura-r11-release-artifact/output
        run: ./scripts/build-release-artifact.sh

      - name: Retain development-unverified artifact and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: aura-development-unverified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/aura-r11-release-artifact/output/AURA-development-unverified.zip
            ${{ runner.temp }}/aura-r11-release-artifact/output/AURA-development-unverified.manifest.json
