name: AURA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS, swift-6.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Swift version
        run: |
          xcode-select -p
          swift --version

      - name: Build production targets
        run: swift build

      - name: Run tests
        env:
          AURA_ENABLE_COVERAGE: "1"
          AURA_COVERAGE_MIN: "70"
        run: ./scripts/aura-test.sh /tmp/aurabuild-ci
