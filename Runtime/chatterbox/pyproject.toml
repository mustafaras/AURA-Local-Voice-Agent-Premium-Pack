[project]
name = "aura-chatterbox-runtime"
version = "0.1.0"
description = "Pinned local-only Chatterbox Multilingual V3 runtime for AURA"
requires-python = "==3.11.*"
dependencies = [
  "chatterbox-tts",
  "resemble-perth",
  "torchcodec==0.15.0",
]

[tool.uv.sources]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git", rev = "5de7a54aa4e5e2baadb0182dde554908b48b85c2" }
resemble-perth = { git = "https://github.com/resemble-ai/Perth.git", rev = "ce86c49d029f42272c1902eccb675556b9ed2330" }

[tool.uv]
override-dependencies = [
  "diffusers==0.38.0",
  "gradio==6.16.0",
  "safetensors==0.8.0",
  "setuptools==83.0.0",
  "starlette==1.3.1",
  "torch==2.13.0",
  "torchaudio==2.10.0",
  "transformers==5.5.0",
]
